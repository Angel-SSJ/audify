services:
  cassandraAudify-seed:
    image: cassandra:latest
    container_name: cassandraAudify-seed
    environment:
      - CASSANDRA_CLUSTER_NAME=AudifyCluster
      - CASSANDRA_SEEDS=cassandraAudify-seed
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
      - JVM_EXTRA_OPTS=-Xms512M -Xmx512M
    volumes:
      - cassandraAudify-seed-data:/var/lib/cassandra
    networks:
      - cassandra-net
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  cassandraAudify-node2:
    image: cassandra:latest
    container_name: cassandraAudify-node2
    environment:
      - CASSANDRA_CLUSTER_NAME=AudifyCluster
      - CASSANDRA_SEEDS=cassandraAudify-seed
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
      - JVM_EXTRA_OPTS=-Xms512M -Xmx512M
    depends_on:
      cassandraAudify-seed:
        condition: service_healthy
    volumes:
      - cassandraAudify-node2-data:/var/lib/cassandra
    networks:
      - cassandra-net

  cassandraAudify-node3:
    image: cassandra:latest
    container_name: cassandraAudify-node3
    environment:
      - CASSANDRA_CLUSTER_NAME=AudifyCluster
      - CASSANDRA_SEEDS=cassandraAudify-seed
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
      - JVM_EXTRA_OPTS=-Xms512M -Xmx512M
    depends_on:
      cassandraAudify-seed:
        condition: service_healthy
    volumes:
      - cassandraAudify-node3-data:/var/lib/cassandra
    networks:
      - cassandra-net

networks:
  cassandra-net:

volumes:
  cassandraAudify-seed-data:
  cassandraAudify-node2-data:
  cassandraAudify-node3-data: